<!DOCTYPE html>
<html>
<head>
    <title>Resume Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Resume Analyzer</h2>

    <form action="analyze" method="post" enctype="multipart/form-data">
        <input type="file" name="resume" required>
        <label for="job">Job Description</label>
        <textarea id="job" name="job" placeholder="Enter Job Description" required></textarea>

        <label for="algo">Matching Algorithm</label>
        <select id="algo" name="algo">
            <option value="advanced" selected>Advanced (token + weighted skills)</option>
            <option value="simple">Simple (keyword intersection)</option>
        </select>

        <button type="submit">Analyze</button>
    </form>

</div>

</body>
</html>
